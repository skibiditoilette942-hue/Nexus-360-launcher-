name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair zip(s) do projeto
        run: |
          for z in *.zip; do
            [ -e "$z" ] && unzip -q -o "$z" -d "extraido_$(basename "$z" .zip)"
          done
          true

      - name: Localizar pasta do projeto
        run: |
          S=$(find . -name settings.gradle -not -path './.git/*' | sort | tail -n 1)
          if [ -z "$S" ]; then S=$(find . -name settings.gradle.kts -not -path './.git/*' | sort | tail -n 1); fi
          if [ -z "$S" ]; then echo "settings.gradle nao encontrado"; exit 1; fi
          DIR=$(dirname "$S")
          echo "Projeto em: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.PROJECT_DIR }}

      - uses: actions/upload-artifact@v4
        with:
          name: xLox360-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
